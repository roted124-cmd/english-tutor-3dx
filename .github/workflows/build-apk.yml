name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: |
          mkdir -p public/models
          curl -fL "https://githubusercontent.com" -o public/models/robot.glb
          curl -fL "https://githubusercontent.com" -o public/models/duck.glb
          curl -fL "https://githubusercontent.com" -o public/models/avocado.glb
          curl -fL "https://githubusercontent.com" -o public/models/car.glb
          curl -fL "https://githubusercontent.com" -o public/models/fox.glb
          npm install --legacy-peer-deps
          npx @capacitor/assets generate --android
          npm run build
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: English-Tutor-3D-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
